services:
  - type: web
    name: expense-tracker-api
    runtime: python
    repo: https://github.com/yourusername/expense-tracker
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:8000 wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: SECURE_COOKIE
        value: "true"
      - key: FRONTEND_URL
        value: https://expense-tracker-livid-theta-48.vercel.app

databases:
  - name: expense-tracker-db
    plan: starter
    region: oregon
