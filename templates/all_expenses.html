<!DOCTYPE html>
<html>
<head>
    <title>All Expenses - Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>📋 All Expenses</h1>

    {% if expenses %}
    <div class="card">
        <table class="expense-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for expense in expenses %}
                <tr>
                    <td>{{ expense.date }}</td>
                    <td>{{ expense.category }}</td>
                    <td>₹ {{ "%.2f"|format(expense.amount) }}</td>
                    <td>
                        <a href="{{ url_for('delete_expense', date=expense.date, amount=expense.amount) }}"
                           class="btn-delete"
                           onclick="return confirm('Delete this expense?')">🗑️ Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="card">
        <p class="empty-state">📝 No expenses recorded yet.</p>
    </div>
    {% endif %}

    <a href="/" class="btn">⬅️ Back to Home</a>
</div>

</body>
</html>
